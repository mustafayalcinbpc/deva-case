; Production PHP ayarları (php.ini-production üzerine; docker/php/Dockerfile, prod aşaması).
expose_php = Off
memory_limit = 256M

; Adım medyası en fazla 20 MB (ProcedureStepRequest::MEDIA_MAX_KB). nginx: client_max_body_size.
upload_max_filesize = 20M
post_max_size = 24M

; Kod imajın içinde ve değişmez; dosya zaman damgaları kontrol edilmez.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
