# Production nginx (compose.prod.yaml, docker/php/Dockerfile "web" aşaması). public/ imajın
# içindedir; public/storage bağlantısı için storage volume'ü salt okunur bağlanır.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;

    # Adım medyası en fazla 20 MB (ProcedureStepRequest::MEDIA_MAX_KB); PHP: docker/php/production.ini.
    client_max_body_size 24m;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # app container yeniden oluşturulunca IP'si değişir; adres Docker DNS'inden yeniden çözülür.
    resolver 127.0.0.11 valid=10s;
    set $php_upstream app:9000;

    # Vite çıktısının dosya adları içerik hash'i taşır; uzun süre önbelleklenebilir.
    location /build/ {
        expires max;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # index.php dışındaki PHP dosyaları çalıştırılmaz.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
